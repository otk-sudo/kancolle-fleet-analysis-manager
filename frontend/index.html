<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      書体は Google Fonts から読み込む（見出し: しっぽり明朝 B1、本文: BIZ UDPゴシック）。
      preconnect は「先に接続だけ始めておく」指定で、文字が表示されるまでの時間を少し短くする。
      display=swap は、書体の読み込みが終わるまで手元の書体で先に文字を出す指定（文字が見えない時間を作らない）
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=BIZ+UDPGothic:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <title>艦隊分析 応募管理</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
