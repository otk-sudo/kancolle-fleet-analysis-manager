# GitHub Actions の設定。プッシュやPRのたびに、GitHub上で自動的にチェックを実行する（CI: 継続的インテグレーション）。
# 3つのジョブ（api / backend / frontend）は同時に動き、どれか1つでも失敗するとPRに赤い×が付く。
# 結果はPRの「Checks」タブで見られる。
name: CI

# いつ実行するか: main へのプッシュ時と、すべてのPR
on:
  push:
    branches: [main]
  pull_request:

# このワークフローに与える権限。読み取りだけに絞っておく（安全のため）
permissions:
  contents: read

jobs:
  api:
    name: OpenAPI定義のチェック
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # リポジトリのコードを取り出す
      - uses: actions/setup-node@v4 # Node.js を用意する
        with:
          node-version: 22
      # OpenAPI定義の書き方の誤りをチェックする
      - run: npx --yes @redocly/cli@2 lint api/openapi.yaml

  scripts:
    name: 起動スクリプトのチェック
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Windows 用の .cmd に英数字以外（日本語など）が入っていないか確かめる。
      # cmd.exe は日本語の Windows では UTF-8 を正しく読めず、スクリプトが壊れるため（scripts/README.md）
      - run: |
          if LC_ALL=C grep -nP '[^\x00-\x7F]' scripts/*.cmd; then
            echo "scripts/*.cmd に英数字以外の文字があります（上の行）。英数字と記号だけで書いてください"
            exit 1
          fi

  backend:
    name: バックエンドのビルドとテスト
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4 # Gradleを用意し、ダウンロードしたライブラリを次回のためにキャッシュする
      # コード生成、コンパイル、テストをまとめて実行する
      - run: ./gradlew build

  frontend:
    name: 画面のビルド
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # package-lock.json に書かれたバージョンどおりにライブラリを入れる（npm install より厳密）
      - run: npm ci
      - run: npm run lint
      - run: npm run build
